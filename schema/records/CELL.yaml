# Seeded from the typed path (CellRec, include/ESPER/Records*.h) in migration step 2.
record: CELL
name: Cell
members:
  - { sig: EDID, name: editorId, type: zstring }   # EDID
  - { sig: FULL, name: fullName, type: lstring, table: strings }   # FULL
  - sig: DATA
    name: flags              # u8 in older records, u16 in current ones
    union:
      by: size
      cases:
        - { when: 1, name: byte, type: u8 }
        - { when: 2, name: word, type: u16 }
  - { sig: XCLC, name: grid, type: CellGrid }   # XCLC (exterior only)
  - { sig: XCLL, name: lighting, type: CellLighting }
  - { sig: TVDT, name: occlusion, type: bytes }   # TVDT
  # step 4, from tools/schema-probe evidence:
  - sig: MHDT
    name: maxHeight
    fields:
      - { name: offset,  type: f32 }
      - { name: heights, type: "u8[1024]" }     # 32x32 grid
  - { sig: LNAM, name: lightingInherits, type: u32 }
  - { sig: XWCN, name: waterCurrentCount, type: u32 }
  - { sig: XWCS, name: waterCurrentSize, type: u32 }
  - sig: XWCU
    name: waterVelocity
    union:
      by: size
      cases:
        - { when: 48, name: v48, type: "f32[12]" }
        - { when: 64, name: v64, type: "f32[16]" }
  - { sig: LTMP, name: lightingTemplate, type: formid }   # LTMP
  - { sig: XCLW, name: waterHeight, type: f32 }   # XCLW
  - { sig: XNAM, name: waterNoise, type: zstring }   # XNAM
  - { sig: XCLR, name: regions, type: "formid[]" }   # XCLR
  - { sig: XLCN, name: location, type: formid }   # XLCN
  - { sig: XCWT, name: water, type: formid }   # XCWT
  - { sig: XOWN, name: owner, type: formid }   # XOWN
  - { sig: XILL, name: lockList, type: formid }   # XILL
  - { sig: XWEM, name: waterEnvMap, type: zstring }   # XWEM
  - { sig: XCCM, name: climate, type: formid }   # XCCM
  - { sig: XCAS, name: acousticSpace, type: formid }   # XCAS
  - { sig: XEZN, name: encounterZone, type: formid }   # XEZN
  - { sig: XCMO, name: music, type: formid }   # XCMO
  - { sig: XCIM, name: imageSpace, type: formid }   # XCIM
