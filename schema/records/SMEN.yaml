# Story Manager event node: a child of the root branch, one per event type (ENAM, a four-character code such as
# KILL). Tree links as in SMBN.
record: SMEN
name: StoryManagerEventNode
members:
  - { sig: EDID, name: editorId, type: zstring }
  - { sig: PNAM, name: parent, type: formid, to: [SMBN, SMEN] }
  - { sig: SNAM, name: nextSibling, type: formid, to: [SMBN, SMQN, SMEN] }
  - { sig: CITC, name: conditionCount, type: u32 }
  - { sig: DNAM, name: flags, type: u32 }
  - { sig: XNAM, name: maxAcrossType, type: u32 }
  - { sig: ENAM, name: event, type: sig4 }
  - { use: Condition, name: conditions, repeat: true }
