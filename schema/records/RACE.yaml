# Seeded from the typed path (RaceRec) in migration step 2. Sexed sections
# (skeleton, NAM1 body data, NAM3 behavior graph, NAM0 head data) modeled from a
# section census of every vanilla RACE: each sex's block opens with MNAM/FNAM.
record: RACE
name: Race
members:
  - { sig: EDID, name: editorId, type: zstring }   # EDID
  - { sig: FULL, name: fullName, type: lstring, table: strings }   # FULL
  - { sig: DESC, name: description, type: lstring, table: dlstrings }   # DESC
  - { sig: SPCT, name: spellCount, type: u32 }   # SPCT
  - { sig: SPLO, name: spells, type: formid, repeat: true }   # SPLO
  - { sig: WNAM, name: skin, type: formid }   # WNAM (skin ARMO)
  - { sig: BOD2, name: biped, type: BipedBodyTemplate }   # BOD2
  - { sig: KSIZ, name: keywordCount, type: u32, countOf: keywords }   # KSIZ
  - { sig: KWDA, name: keywords, type: "formid[]" }   # KWDA
  - { use: RaceSkeleton, name: maleSkeleton }
  - { use: RaceSkeleton, name: femaleSkeleton, sigs: { MNAM: FNAM } }
  - { sig: MTNM, name: movementNames, type: bytes, repeat: true }   # MTNM (4-char tags)
  - { sig: VTCK, name: voices, type: "formid[]" }   # VTCK (male+female in one sub)
  - { sig: DNAM, name: decapArmors, type: "formid[]" }   # DNAM (male+female)
  - { sig: HCLF, name: defaultHairColors, type: "formid[]" }   # HCLF (male+female)
  - { sig: TINL, name: tintCount, type: u16 }   # TINL
  - { sig: PNAM, name: facegenMainClamp, type: f32 }   # PNAM
  - { sig: UNAM, name: facegenFaceClamp, type: f32 }   # UNAM
  - { sig: ATKR, name: attackRace, type: formid }   # ATKR
  - { sig: ATKE, name: attackEvents, type: zstring, repeat: true }   # ATKE
  - group: bodyData
    open: NAM1
    members:
      - { sig: NAM1, name: start, type: marker }
      - { use: RaceBodyParts, name: male }
      - { use: RaceBodyParts, name: female, sigs: { MNAM: FNAM } }
  - group: behaviorGraph
    open: NAM3
    members:
      - { sig: NAM3, name: start, type: marker }
      - { use: RaceModel, name: male }
      - { use: RaceModel, name: female, sigs: { MNAM: FNAM } }
  - { sig: GNAM, name: bodyPartData, type: formid }   # GNAM
  - { sig: NAM4, name: materialType, type: formid }   # NAM4
  - { sig: NAM5, name: impactDataSet, type: formid }   # NAM5
  - { sig: NAM7, name: decapFx, type: formid }   # NAM7
  - { sig: ONAM, name: openLootSound, type: formid }   # ONAM
  - { sig: LNAM, name: closeLootSound, type: formid }   # LNAM
  - { sig: NAME, name: bipedObjectNames, type: zstring, repeat: true }   # NAME ×32
  - { sig: MTYP, name: movementTypes, type: formid, repeat: true }   # MTYP
  - { sig: VNAM, name: equipmentFlags, type: u32 }   # VNAM
  - { sig: QNAM, name: equipSlots, type: formid, repeat: true }   # QNAM
  - { sig: UNES, name: unarmedEquipSlot, type: formid }   # UNES
  - { sig: PHTN, name: phonemeNames, type: zstring, repeat: true }   # PHTN
  - { sig: PHWT, name: phonemeWeights, type: bytes, repeat: true }   # PHWT
  - { sig: WKMV, name: baseMoveDefault, type: formid }   # WKMV
  - { sig: RNMV, name: baseMoveRun, type: formid }   # RNMV
  - { sig: SNMV, name: baseMoveSwim, type: formid }   # SNMV
  - { sig: FLMV, name: baseMoveFly, type: formid }   # FLMV
  - { sig: SPMV, name: baseMoveSneak, type: formid }   # SNKMV? (kept: SPMV sprint)
  # Head data: one NAM0 section per sex (male first); a race may have none.
  - group: headData
    repeat: true
    open: NAM0
    members:
      - { sig: NAM0, name: start, type: marker }
      - { use: RaceHead, name: male }
      - { use: RaceHead, name: female, sigs: { MNAM: FNAM, RPRM: RPRF, AHCM: AHCF, FTSM: FTSF, DFTM: DFTF } }
  - { sig: RNAM, name: armorRace, type: formid }   # RNAM
