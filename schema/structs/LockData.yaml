# XLOC. The bytes after `level` and `flags` are uninitialized in vanilla data
# (they vary randomly), so they're kept as named padding.
struct: LockData
size: 20
fields:
  - { name: level,    type: u8 }
  - { name: pad0,     type: "u8[3]" }
  - { name: key,      type: formid, to: [KEYM] }
  - { name: flags,    type: u8 }
  - { name: pad1,     type: "u8[3]" }
  - { name: unknown0, type: u32 }
  - { name: unknown1, type: u32 }
